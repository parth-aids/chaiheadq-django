{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="mt-4">
    <h2 class="text-white">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p>Don't have an account?<a href="{% url 'register' %}"> Register here.</a></p>
</div>
{% endblock %}
